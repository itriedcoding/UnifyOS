name: ISO build and boot test

# Builds the minimal live image on a Linux runner, tests the live init, boots the
# image under both BIOS and UEFI firmware plus a second CD transport in QEMU, and
# only then publishes it. A tag push creates a GitHub release with the image and
# its checksum; a manual run keeps the image as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    name: Build, boot-test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            squashfs-tools xorriso mtools busybox-static \
            grub-pc-bin grub-efi-amd64-bin \
            qemu-system-x86 ovmf seabios \
            python3

      - name: Fetch a current Debian archive keyring
        # The runner is Ubuntu, whose debian-archive-keyring can be older than
        # the keys the Debian archive is signed with; without this, mmdebstrap
        # rejects every InRelease with NO_PUBKEY. Install the real keyring
        # rather than turning signature checking off.
        run: |
          set -euo pipefail
          pool=https://deb.debian.org/debian/pool/main/d/debian-archive-keyring
          listing="$(curl -fsSL "$pool/")"
          # The [^\"] classes keep each match inside one quoted filename.
          pick() { printf '%s' "$listing" | grep -oE "$1" | sort -V | tail -1; }
          file="$(pick 'debian-archive-keyring_[0-9][^\"]*deb12u[0-9]+_all[.]deb' || true)"
          if [ -z "$file" ]; then
            file="$(pick 'debian-archive-keyring_[0-9][^\"]*_all[.]deb' || true)"
          fi
          [ -n "$file" ] || { echo "error: no keyring package in pool listing" >&2; exit 1; }
          echo "using $file"
          curl -fsSL "$pool/$file" -o /tmp/debian-archive-keyring.deb
          dpkg-deb -x /tmp/debian-archive-keyring.deb /tmp/debian-keyring
          test -r /tmp/debian-keyring/usr/share/keyrings/debian-archive-keyring.gpg
          echo "KEYRING=/tmp/debian-keyring/usr/share/keyrings/debian-archive-keyring.gpg" >> "$GITHUB_ENV"

      - name: Test that the live init cannot exit as PID 1
        # A VM that panicked with "Attempted to kill init" is what prompted this
        # test: the init has to survive a boot where no medium is found.
        run: sudo bash ./scripts/test-live-init.sh

      - name: Bootstrap the minimal root filesystem
        run: |
          sudo env KEYRING="$KEYRING" ./iso/bootstrap-rootfs.sh --edition minimal --target build/rootfs-minimal

      - name: Hand the build tree back to the runner
        # The bootstrap runs as root, so build/rootfs-minimal is root-owned and
        # the unprivileged build step cannot create directories beside it.
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Build the live ISO
        run: |
          chmod +x iso/*.sh scripts/*.sh
          KERNEL_DIR="$PWD/build/rootfs-minimal" \
          BASE_ROOTFS="$PWD/build/rootfs-minimal" \
          BUSYBOX="$(command -v busybox)" \
            ./iso/build-live.sh

      - name: Boot test under BIOS, UEFI and virtio-scsi
        run: |
          ISO="$(ls out/*-minimal-amd64.iso | head -1)"
          echo "testing $ISO"
          ./scripts/qemu-boot-test.sh "$ISO"

      - name: Keep the boot logs
        # Serial consoles of every firmware and transport case, so a failed boot
        # can be diagnosed from the run itself instead of being re-run blind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boottest-logs
          path: build/boottest/
          if-no-files-found: ignore

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: unifyos-minimal-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            out/*.iso out/*.sha256 \
            --title "UnifyOS ${GITHUB_REF_NAME#v}" \
            --notes "Minimal live console image. Booted under BIOS, UEFI and virtio-scsi in CI before publication."
