# UnifyOS Desktop — GRUB boot menu (UEFI and legacy BIOS)
set default=0
set timeout=10
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm
set menu_color_normal=light-gray/black
set menu_color_highlight=white/dark-gray

menuentry "UnifyOS Desktop — live session" --id live {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3
    initrd /live/initrd.img
}

menuentry "UnifyOS Desktop — live session (safe graphics)" --id live-safe {
    linux /live/vmlinuz boot=live components nomodeset quiet splash loglevel=3
    initrd /live/initrd.img
}

menuentry "UnifyOS Desktop — live session with persistence" --id live-persistent {
    linux /live/vmlinuz boot=live components persistence quiet splash loglevel=3
    initrd /live/initrd.img
}

menuentry "Install UnifyOS" --id install {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 unify.installer=1
    initrd /live/initrd.img
}

menuentry "Install UnifyOS (safe graphics)" --id install-safe {
    linux /live/vmlinuz boot=live components nomodeset quiet splash loglevel=3 unify.installer=1
    initrd /live/initrd.img
}

menuentry "UnifyOS live session (verbose boot)" --id live-verbose {
    linux /live/vmlinuz boot=live components loglevel=7
    initrd /live/initrd.img
}

menuentry "Boot from first hard disk" --id hd {
    set root=(hd0)
    chainloader +1
}

menuentry "Reboot" --id reboot {
    reboot
}

menuentry "Power off" --id poweroff {
    halt
}
