# UnifyOS Minimal — GRUB boot menu (UEFI and legacy BIOS).
# Console-only image: no splash, no framebuffer mode switching.
#
# The version is deliberately absent from the entry titles: .disk/info and
# /etc/os-release carry it, and a hard-coded string here went stale on the
# first version bump.

set default=0
set timeout=5

insmod all_video
terminal_output console

menuentry "UnifyOS Minimal — live console" --id live {
    linux /live/vmlinuz console=tty0 console=ttyS0,115200 quiet
    initrd /live/initrd.img
}

menuentry "UnifyOS Minimal — verbose boot" --id live-verbose {
    linux /live/vmlinuz console=tty0 console=ttyS0,115200 loglevel=7
    initrd /live/initrd.img
}

menuentry "UnifyOS Minimal — no KMS (troubleshooting)" --id live-nokms {
    linux /live/vmlinuz console=tty0 console=ttyS0,115200 nomodeset loglevel=7
    initrd /live/initrd.img
}

menuentry "Reboot" --id reboot {
    reboot
}

menuentry "Power off" --id poweroff {
    halt
}
